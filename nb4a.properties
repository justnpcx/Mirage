PACKAGE_NAME=com.justnpcx.mirage
VERSION_NAME=1.0.3
PRE_VERSION_NAME=pre-1.0.3
# Monotonic build number, used verbatim as android:versionCode (no more x5).
# 1.0.0~1.0.11 were debugging builds (versionCodes 5..55). The name restarts at 1.0.0 for the
# first public release, but the code only ever goes up (55 debug builds, 60 first 1.0.0 cut,
# 61 second, 62 with the startup profile, 63 with the node-list profile, 64 with share diagnostics, 65 with the Settings crash fix, 66 without the diagnostics, 67 with the all-screens test, 68 with the icon fix, 69 with the bold 2-arch mark, 70 for 1.0.1 with the TV banner, 71 for 1.0.2 with the IPv6 default fix, 72 for 1.0.3 with the Nodes drawer fix) so an installed
# build can always upgrade in place instead of hitting
# INSTALL_FAILED_VERSION_DOWNGRADE.
VERSION_CODE=72
