PACKAGE_NAME=com.justnpcx.mirage
VERSION_NAME=1.0.2
PRE_VERSION_NAME=pre-1.0.2
# Monotonic build number, used verbatim as android:versionCode (no more x5).
# The NAME restarts at 1.0.0 for each public release line; the CODE only ever goes up, so an
# installed build can always upgrade in place instead of hitting INSTALL_FAILED_VERSION_DOWNGRADE.
# The 1.0.0~1.0.11 debug builds used 5..55, the first 1.0.0 line used 60..69, the second
# (1.0.1~1.0.4) used 70..73, and the current 1.0.0 line started at 74 (75 status-bar icon,
# 76 REALITY ML-KEM switch + log diagnosis, 77 remote-DNS routing fix, 78 XHTTP casing +
# bottom-inset fix, 79 urltest groups + explicit route.final + fakeip cache file,
# 80 remote rule set subscriptions, 81 -> 1.0.1 with optimistic DNS cache and the Hysteria2
# 1.14 additions, 82 -> 1.0.2 with Snell).
VERSION_CODE=82
