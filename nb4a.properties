PACKAGE_NAME=com.justnpcx.mirage
VERSION_NAME=1.0.0
PRE_VERSION_NAME=pre-1.0.0
# Monotonic build number, used verbatim as android:versionCode (no more x5).
# 1.0.0~1.0.11 were debugging builds (versionCodes 5..55). The name restarts at 1.0.0 for the
# first public release, but the code stays above every build shipped so far (55 for the debug
# builds, 60 for the first 1.0.0 cut) so an installed build can always upgrade in place instead
# of hitting INSTALL_FAILED_VERSION_DOWNGRADE.
VERSION_CODE=61
