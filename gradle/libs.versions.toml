[versions]
# Build toolchain
agp = "8.8.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"

# Compose / Material 3
composeBom = "2024.09.03"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"

# AndroidX / UI (legacy View stack, kept during incremental migration)
coreKtx = "1.9.0"
recyclerview = "1.3.0"
activityKtx = "1.10.1"
fragmentKtx = "1.5.6"
browser = "1.5.0"
swiperefreshlayout = "1.1.0"
constraintlayout = "2.1.4"
navigation = "2.5.3"
preference = "1.2.0"
appcompat = "1.6.1"
work = "2.8.1"
material = "1.8.0"
profileinstaller = "1.4.1"

# Data
room = "2.6.1"
roomigrant = "0.3.4"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.6.4"
kryo = "5.2.1"
gson = "2.9.0"
snakeyaml = "1.30"

# Networking / misc
okhttp = "5.0.0-alpha.3"
zxingLite = "2.1.1"
editorKit = "2.6.0"
materialAbout = "3.2.0-rc01"
processPhoenix = "2.1.2"
guava = "31.0.1-android"
ini4j = "0.5.4"
fastscroll = "2.0.1"
desugar = "2.0.3"

# Testing
junit = "4.13.2"
kotlinxCoroutinesTest = "1.6.4"
robolectric = "4.14.1"

[libraries]
# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# AndroidX core / View stack
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-multiprocess = { group = "androidx.work", name = "work-multiprocess", version.ref = "work" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

# Data
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
roomigrant-lib = { group = "com.github.MatrixDev.Roomigrant", name = "RoomigrantLib", version.ref = "roomigrant" }
roomigrant-compiler = { group = "com.github.MatrixDev.Roomigrant", name = "RoomigrantCompiler", version.ref = "roomigrant" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kryo = { group = "com.esotericsoftware", name = "kryo", version.ref = "kryo" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

# Networking / misc
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
zxing-lite = { group = "com.github.jenly1314", name = "zxing-lite", version.ref = "zxingLite" }
editorkit = { group = "com.blacksquircle.ui", name = "editorkit", version.ref = "editorKit" }
editorkit-language-base = { group = "com.blacksquircle.ui", name = "language-base", version.ref = "editorKit" }
editorkit-language-json = { group = "com.blacksquircle.ui", name = "language-json", version.ref = "editorKit" }
material-about-library = { group = "com.github.daniel-stoneuk", name = "material-about-library", version.ref = "materialAbout" }
process-phoenix = { group = "com.jakewharton", name = "process-phoenix", version.ref = "processPhoenix" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
ini4j = { group = "org.ini4j", name = "ini4j", version.ref = "ini4j" }
fastscroll = { group = "com.simplecityapps", name = "recyclerview-fastscroll", version.ref = "fastscroll" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
