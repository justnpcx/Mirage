name: Build Mirage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Prepare signing & SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 keystore.properties)" >> "$GITHUB_ENV"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Download assets
        run: ./run init action gradle
      - name: Static analysis & unit tests
        run: >-
          ./gradlew
          :app:detekt :core:model:detekt :core:subscription:detekt
          :core:model:allTests :core:subscription:allTests
          :app:testOssReleaseUnitTest
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: ./gradlew app:assembleOssRelease
      - name: Collect artifacts
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name '*.apk' -exec cp {} apks/ \;
          ls -lh apks
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-APKs
          path: apks/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: Mirage-APKs
          path: apks
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          body: |
            Mirage 1.0.4

            - 界面：删掉抽屉里多余的「节点」。它和「订阅与分组」展示的是同一份内容（后者本来就是**一个分组一个 tab、tab 里是该分组的节点**），属于重复入口。现在的结构回到上游：**首页 = 连接状态/流量/当前节点**，**订阅与分组 = 选节点**，**分组 = 管理分组**。
            - 界面：设置页等所有偏好行的标题字号由 18sp 改回 **16sp**（摘要 14sp），和系统 Material 偏好行、以及原版一致。
            - 界面：分组列表的每一行现在都可以点击 —— 点进去会把该分组设为当前分组并打开「订阅与分组」对应 tab；「未分组」也补上了编辑按钮（之前被隐藏，无法改名）。

            上一版（1.0.3）：

            - 修复：抽屉里的「节点」点不动（完全没反应）——该菜单项从未接到任何页面，返回 false 时连抽屉的选中态都不会变。**1.0.4 已把该菜单直接移除（见上）。**
            - 修复：默认 IPv6 路由由「禁用」改为「启用」。禁用时 DNS 策略是 `ipv4_only`，sing-box 只发 A 查询，于是**纯 IPv6 域名**的服务器（没有 A 记录）永远解析不到。改为「启用」后策略是 `prefer_ipv4`：仍优先 IPv4，但 AAAA 可解析，且 IPv6 走隧道内、不会从原生网卡泄漏。
              ⚠️ 只影响新安装。已装设备请在「设置 → IPv6 路由」手动切到「启用」。
            - 修复：Android TV / Fire TV 的 320×180 banner 之前误用方形桌面图标，现提供真正的 16:9 banner（`res/drawable-xhdpi/tv_banner.png`）

            内核与特性：

            - 内核 sing-box `1.14.x`（[justnpcx/sing-box](https://github.com/justnpcx/sing-box)）
            - 支持 Xray-core v26+ REALITY 后量子 `X25519MLKEM768`
            - 实现 xhttp（`stream-one` / `stream-up` / `downloadSettings`）
            - Compose + Material 3 界面（Compose 1.11 / Material 3 1.4），全 App 统一主题配色
            - 订阅 / 分享链接解析下沉到 KMP 共享核心

            按 ABI 拆分的 APK：手机一般选 `arm64-v8a`。包名 `com.justnpcx.mirage`，可与官方 NekoBox 共存。

            需要 **Android 7.0（API 24）** 及以上。
