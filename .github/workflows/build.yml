name: Build Mirage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Prepare signing & SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 keystore.properties)" >> "$GITHUB_ENV"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Download assets
        run: ./run init action gradle
      - name: Static analysis & unit tests
        run: >-
          ./gradlew
          :app:detekt :core:model:detekt :core:subscription:detekt
          :core:model:allTests :core:subscription:allTests
          :app:testOssReleaseUnitTest
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: ./gradlew app:assembleOssRelease
      - name: Collect artifacts
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name '*.apk' -exec cp {} apks/ \;
          ls -lh apks
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-APKs
          path: apks/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: Mirage-APKs
          path: apks
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          body: |
            Mirage 1.0.1 —— 基于 **sing-box 1.14** 的 Android 通用代理客户端。

            **1.0.1 更新**

            - **新增：远程规则集订阅**。除了内置 `geosite:` / `geoip:`，现在可以订阅任意 `.srs` / `.json` 规则集（sing-box 自行下载并按间隔刷新）。抽屉 →「规则集」添加，然后在路由规则的域名/IP 栏填它的名称即可引用。
            - **新增：自动选最快节点**。分组模式可选「自动选择（URL 测速）」—— 内核探测组内每个节点并始终使用最快的，无需手动切换。节点列表仍支持一键测速与按延迟排序。
            - **新增：乐观 DNS 缓存**（默认开启）与 **DNS 查询超时**设置。
            - **新增：Hysteria2 新能力** —— gecko 混淆、BBR 拥塞控制档位、端口跳跃间隔随机化、关闭 Chrome QUIC 指纹模仿。
            - **修复：境外 DNS 之前走的是直连**。`dns-remote`（如 dns.google）没有 `detour`，被 sing-box 当作纯直连拨号 —— 在受限网络里必然失败，并连带所有境外域名解析不了，表现就是「有流量但打不开网页」。现已显式走隧道。
            - **修复：底部卡片被系统导航栏遮挡**（Android 15 强制 edge-to-edge）。
            - 其他：显式 `route.final`、FakeIP 映射持久化、抽屉里与「订阅与分组」重复的「节点」菜单已移除、状态栏图标换成新标识。

            **内核走在前面**

            内核是自维护的 [justnpcx/sing-box](https://github.com/justnpcx/sing-box) fork（分支 `nb-next-1.14.x`），基于 sing-box `1.14.x`。上游还没发版、甚至还没实现的能力，可以先落到客户端。

            **XHTTP 传输**

            sing-box 官方**没有**这个传输。已在 fork 内核中实现，支持 `stream-one` / `stream-up` / `downloadSettings` —— 上下行可以分流到不同服务器。

            **REALITY 后量子**

            支持 Xray-core v26+ 要求的 `X25519MLKEM768`。缺了它的客户端与新版 Xray 服务端（例如 3x-ui）握手会直接失败。

            **DNS 健康检查**

            sing-box 本身没有 DNS 故障转移。客户端在连接前探测所配 DNS，选用首个可达的（失败开放 + 结果缓存），避免某个 DNS 挂掉就整体连不上。

            **共享核心**

            订阅与分享链接解析全部下沉到 Kotlin Multiplatform 的 `:core:model` / `:core:subscription`，Android 端不再自行解析，同一份逻辑可跨平台测试。

            **界面**

            Jetpack Compose + Material 3，单向数据流（ViewModel + StateFlow），全 App 统一主题与配色。

            **支持的协议**

            SOCKS (4/4a/5) · HTTP(S) · SSH · Shadowsocks · VMess · Trojan · VLESS · AnyTLS · ShadowTLS · TUIC · Hysteria 1/2 · WireGuard
            （Trojan-Go / NaïveProxy / Mieru 需[插件](https://matsuridayo.github.io/nb4a-plugin/)）

            **支持的传输**

            TCP · WebSocket · HTTP/2 · QUIC · gRPC · HTTPUpgrade · XHTTP

            按 ABI 拆分的 APK：手机一般选 `arm64-v8a`。包名 `com.justnpcx.mirage`，可与官方 NekoBox 共存。

            需要 **Android 7.0（API 24）** 及以上。
