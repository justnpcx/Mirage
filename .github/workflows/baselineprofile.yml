name: Baseline Profile

# Baseline Profile generation needs a device running API 28+, and the emulator needs KVM —
# GitHub's ubuntu runners have it, so this is the only place it can run without a phone plugged in.
# The result is uploaded as an artifact rather than committed by CI, so the profile goes through
# review like any other source change.
#
# HOW TO REGENERATE
#
# 1. Trigger this workflow (the fine-grained PAT can push code but has no Actions:write, so the
#    branch route is the one that works unattended):
#       git push origin main:baseline-profile      # triggers the run
#       git push origin --delete baseline-profile  # clean up afterwards
#    Or use Actions -> Baseline Profile -> Run workflow with a token that has Actions:write.
#
# 2. Wait for the run (~20 min: libcore is cached, then the emulator boots and the test runs).
#
# 3. Take the artifact named `baseline-profile` and put its single file at
#    app/src/ossRelease/generated/baselineProfiles/baseline-prof.txt
#    (the artifact keeps the path relative to app/src, so it unpacks as
#     ossRelease/generated/baselineProfiles/baseline-prof.txt). Only the oss flavor gets a
#    profile; the others are not shipped.
#
# 4. Verify it is really merged, without a device:
#       ./gradlew :app:assembleOssRelease
#       # merged rule size: ~796 KB with our profile vs ~321 KB without (library profiles only)
#       wc -c app/build/intermediates/l8_art_profile/ossRelease/expandOssReleaseL8ArtProfileWildcards/baseline-prof.txt
#       # and the shipped APK must no longer carry the stub
#       unzip -l app/build/outputs/apk/oss/release/Mirage-*-arm64-v8a-unsigned.apk | grep dexopt
#
# 5. Commit the profile, then bump VERSION_CODE in nb4a.properties (monotonic; never reuse a value)
#    and move the release tag so the APK actually ships it.
#
# To collect on a real phone instead (better: the profile then matches real usage), connect it with
# API 28+ and run ./gradlew :app:generateOssBaselineProfile locally — it writes the same file in
# step 3. Edit BaselineProfileGenerator.kt first if you want it to cover more than app startup.
#
# Do NOT bump androidx.baselineprofile past 1.3.4: its jar carries Kotlin 2.1.0 metadata while
# buildSrc's kotlin-dsl compiler expects 1.9.0, and :buildSrc:compileKotlin fails.

on:
  workflow_dispatch:
  push:
    branches:
      - baseline-profile

permissions:
  contents: read

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error

  profile:
    name: Generate Baseline Profile
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Prepare signing & SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 keystore.properties)" >> "$GITHUB_ENV"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Download assets
        run: ./run init action gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --max-workers=2 :app:generateOssBaselineProfile
      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/**/generated/baselineProfiles/**
          if-no-files-found: error
